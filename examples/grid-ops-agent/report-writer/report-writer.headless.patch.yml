# 报表生成智能体 report-writer 的 headless 一次性演示 overlay（dsh --profile
# headless --patch 本文件 "任务"）。业务定义不写在这里：persona 从 preset 的
# persona.md（apps/cli/config/agent-presets/report-writer/persona.md，业务定义
# 唯一位置）读取；取数与 PDF 流程技能经 customSkillDirs 挂载，与 preset 面一致。
# 路径按「仓库根目录启动」解析（process.cwd()），演示命令均从仓库根执行。

# 角色/输入模式/报告结构/PDF 交付契约：preset 的 persona.md。
- id: system-prompt
  config:
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/report-writer/persona.md'), 'utf8')"

# 与 preset 相同的技能根：preset 的 skills/ 目录（report-writer-toolbox 一个
# 技能，含历史落库取数与离线 PDF 脚本）；includeDefaultRoots: false 排除项目/
# 用户技能根。patch 整体替换 config，其余字段取默认。
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/report-writer/skills')"

# 统计数字只来自本地历史落库、扩写只来自用户要点，外部网页检索来源不进报表。
- id: tool-web
  disabled: true

# 仓库的编码工作区指令与报表会话无关。
- id: agent-instructions
  disabled: true
