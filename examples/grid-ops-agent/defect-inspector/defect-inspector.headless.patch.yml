# 缺陷识别智能体 defect-inspector 的 headless 一次性演示 overlay（dsh --profile
# headless --patch 本文件 "缺陷描述"）。业务定义不写在这里：persona 从 preset 的
# persona.md（apps/cli/config/agent-presets/defect-inspector/persona.md，业务定义
# 唯一位置）读取；判定流程技能与 ragflow-dataset-ingest 技能经 customSkillDirs
# 挂载，与 preset 面一致。路径按「仓库根目录启动」解析（process.cwd()），演示命令
# 均从仓库根执行。开发期视觉输入未接入，演示输入为文字缺陷描述（persona 的
# 「输入与视觉输入路径」节定义两条链路的分工）。

# 角色/定级语义/澄清式交互规则：preset 的 persona.md（defect-inspector 业务定义唯一位置）。
- id: system-prompt
  config:
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/defect-inspector/persona.md'), 'utf8')"

# 与 preset 相同的技能根：preset 的 skills/ 目录（defect-inspection +
# ragflow-dataset-ingest 符号链接）；includeDefaultRoots: false 排除项目/用户
# 技能根，技能目录只剩这两个。patch 整体替换 config，其余字段取默认。
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/defect-inspector/skills')"

# 缺陷判定的依据面只有 RAGFlow 规程库与用户投喂库；外部网页检索的来源不属于
# 依据层级中的任何一层，关闭。
- id: tool-web
  disabled: true

# 仓库的编码工作区指令与缺陷识别无关。
- id: agent-instructions
  disabled: true
