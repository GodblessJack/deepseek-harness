# 知识更新智能体 kb-updater 的 headless 一次性演示 overlay（dsh --profile
# headless --patch 本文件 "任务"）。业务定义不写在这里：persona 从 preset 的
# persona.md（apps/cli/config/agent-presets/kb-updater/persona.md，业务定义唯一
# 位置）读取；投喂流程技能与 ragflow-dataset-ingest 技能经 customSkillDirs 挂载，
# 与 preset 面一致。路径按「仓库根目录启动」解析（process.cwd()），演示命令均从
# 仓库根执行。

# 角色/留痕必填/质检/半成功反馈契约：preset 的 persona.md。
- id: system-prompt
  config:
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/kb-updater/persona.md'), 'utf8')"

# 与 preset 相同的技能根：preset 的 skills/ 目录（kb-updater-feed +
# ragflow-dataset-ingest 符号链接）；includeDefaultRoots: false 排除项目/用户
# 技能根，技能目录只剩这两个。patch 整体替换 config，其余字段取默认。
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').resolve(process.cwd(), 'apps/cli/config/agent-presets/kb-updater/skills')"

# 投喂动作只面向本机 RAGFlow，外部网页检索不参与。
- id: tool-web
  disabled: true

# 仓库的编码工作区指令与投喂会话无关。
- id: agent-instructions
  disabled: true
