# 知识更新智能体 kb-updater 的 SDK 多轮演示组合（JSON-RPC stdio runtime）。
# 角色/留痕必填/质检/半成功反馈契约不写在本文件：persona 由驱动脚本从 preset
# 的 persona.md（apps/cli/config/agent-presets/kb-updater/persona.md，业务定义
# 唯一位置）经 DSH_SYSTEM_PROMPT 注入；投喂流程技能与 ragflow-dataset-ingest
# 技能经 customSkillDirs 挂载，与 preset 面一致。stdout 保留给 JSON-RPC；
# 诊断走 stderr。bash 超时放宽到 10 分钟：图谱增量构建约需 1～4 分钟。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 600000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a grid O&M knowledge update agent.'
    workspaceContext: false
    skills:
      enabled: true
      filesystem:
        watch: false
        includeDefaultRoots: false
        # JSON array of absolute skill directories, set by the demo driver:
        # the preset's kb-updater-feed skill plus its ragflow-dataset-ingest
        # symlink (resolved to the repo's skill copy by the driver).
        customSkillDirs: !!js "JSON.parse(process.env.KB_UPDATER_SKILL_DIRS ?? '[]')"
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
